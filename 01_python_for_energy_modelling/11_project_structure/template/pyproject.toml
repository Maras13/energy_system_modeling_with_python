[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-energy"
version = "0.1.0"
description = "Single-bus dispatch model of a Croatia-like power system (course template, project P1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pypsa>=1.0",
    "highspy>=1.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hr-energy = "hr_energy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]          # tests run in a fresh clone, even before `pip install -e .`
filterwarnings = [
    # raised inside PyPSA, not by this project; remove once PyPSA 2.0 settles the string dtype
    "ignore:pandas infers the `str` dtype:FutureWarning",
]
