<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Three-node DC network with a voltage source and a current source</title>
  <desc>A 100 V voltage source at node 1 feeds node 2 through R12 = 2 ohm and node 3 through R23 = 3 ohm. Loads R20 = 10 ohm and R30 = 20 ohm connect nodes 2 and 3 to the reference node. A 2 A current source injects into node 3.</desc>
  <rect width="720" height="350" fill="#ffffff"/>
  <g stroke="#444441" stroke-width="1.5" fill="none">
    <path d="M90 80 L190 80"/><path d="M270 80 L370 80"/><path d="M450 80 L640 80"/>
    <path d="M90 80 L90 168"/><path d="M90 212 L90 300"/>
    <path d="M330 80 L330 150"/><path d="M330 230 L330 300"/>
    <path d="M510 80 L510 150"/><path d="M510 230 L510 300"/>
    <path d="M640 80 L640 168"/><path d="M640 212 L640 300"/>
    <path d="M90 300 L640 300"/>
  </g>
  <circle cx="90" cy="190" r="22" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="90" y="184" text-anchor="middle" font-size="15" fill="#185FA5" font-weight="bold">+</text>
  <text x="90" y="205" text-anchor="middle" font-size="15" fill="#185FA5" font-weight="bold">−</text>
  <circle cx="640" cy="190" r="22" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <path d="M640 204 L640 178 M634 184 L640 177 L646 184" stroke="#0F6E56" stroke-width="1.8" fill="none"/>
  <g fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2">
    <rect x="190" y="70" width="80" height="20" rx="3"/>
    <rect x="370" y="70" width="80" height="20" rx="3"/>
    <rect x="320" y="150" width="20" height="80" rx="3"/>
    <rect x="500" y="150" width="20" height="80" rx="3"/>
  </g>
  <g fill="#444441">
    <circle cx="150" cy="80" r="4"/><circle cx="330" cy="80" r="4"/><circle cx="510" cy="80" r="4"/>
    <circle cx="330" cy="300" r="4"/><circle cx="510" cy="300" r="4"/>
  </g>
  <g fill="#2C2C2A" font-size="14" font-weight="bold">
    <text x="58" y="195" text-anchor="end">100 V</text>
    <text x="150" y="58" text-anchor="middle">Node 1</text>
    <text x="330" y="58" text-anchor="middle">Node 2</text>
    <text x="510" y="58" text-anchor="middle">Node 3</text>
    <text x="672" y="195">2 A</text>
  </g>
  <g fill="#5F5E5A" font-size="13">
    <text x="230" y="58" text-anchor="middle">R12 = 2 Ω</text>
    <text x="410" y="58" text-anchor="middle">R23 = 3 Ω</text>
    <text x="345" y="195">R20 = 10 Ω</text>
    <text x="525" y="195">R30 = 20 Ω</text>
    <text x="365" y="330" text-anchor="middle">Reference node 0 (V = 0)</text>
  </g>
</svg>
